[workspace]
resolver = "2"
members = ["clipvault-core", "clipvault"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["Chamal Bandara <https://github.com/CRB-CyberSec-Dev/>"]
homepage = "https://github.com/CRB-CyberSec-Dev/"
repository = "https://github.com/CRB-CyberSec-Dev/"

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
async-channel = "2"
blake3 = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
libc = "0.2"

# Backends
x11rb = { version = "0.14", features = ["xfixes", "randr", "xtest"] }
wl-clipboard-rs = "0.9"

# UI (versions verified against system GTK 4.22 / libadwaita 1.9 / gtk4-layer-shell 1.3)
gtk4 = { version = "0.11", features = ["v4_10"] }
gdk4-x11 = "0.11"
libadwaita = { version = "0.9", features = ["v1_6", "gtk_v4_10"] }
gtk4-layer-shell = "0.8"
ksni = { version = "0.3", features = ["blocking"] }

[profile.release]
lto = "thin"
codegen-units = 1
